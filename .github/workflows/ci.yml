name: Firefox regression tests and development package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: npm ci --ignore-scripts
      - name: Regression tests
        run: npm test
      - name: Mozilla Add-ons validation
        run: npm run lint
      - name: Build unsigned package
        run: python scripts/build.py
      - name: Install Firefox test tools
        run: python -m pip install -r tests/requirements.txt
      - name: Test actual extension in isolated Firefox
        run: python -u tests/firefox_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: save-image-as-development-package
          path: artifacts/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: save-image-as-development-package
          path: artifacts
      - name: Publish GitHub development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content save-image-as/manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Version and tag differ' }
          gh release create $env:GITHUB_REF_NAME "artifacts/save-image-as-$version-unsigned.zip" artifacts/SHA256.txt --verify-tag --title "Save image as $version (desarrollo, sin firma Mozilla)" --notes-file CHANGELOG.md
